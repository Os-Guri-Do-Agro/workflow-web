<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- "Bliss" à mão (easter egg XP): céu rico, cumulus fofas e colina única iluminada. -->
  <defs>
    <!-- Céu: azul profundo no topo → azul-céu → quase branco no horizonte -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a68c9"/>
      <stop offset="0.42" stop-color="#3f86d6"/>
      <stop offset="0.70" stop-color="#7fb4e4"/>
      <stop offset="0.88" stop-color="#c9e2f5"/>
      <stop offset="1" stop-color="#e4f0fa"/>
    </linearGradient>

    <!-- Brilho de sol difuso perto do horizonte -->
    <radialGradient id="sun" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#eaf4ff" stop-opacity="0.26"/>
      <stop offset="0.72" stop-color="#dcecff" stop-opacity="0"/>
    </radialGradient>

    <!-- Nuvem: branco no topo → cinza-claro na base achatada (dá volume, não lava) -->
    <radialGradient id="cloud" cx="0.5" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4f8fc"/>
      <stop offset="1" stop-color="#cdd9e5"/>
    </radialGradient>

    <!-- Colina: verde vivo iluminado na crista → verde profundo na base -->
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86c232"/>
      <stop offset="0.12" stop-color="#7db53a"/>
      <stop offset="0.55" stop-color="#3e7a24"/>
      <stop offset="1" stop-color="#2e6b1b"/>
    </linearGradient>

    <!-- Faixa de highlight ensolarado logo abaixo da crista -->
    <linearGradient id="crest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3ec92" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#d3ec92" stop-opacity="0"/>
    </linearGradient>

    <!-- Vinheta lateral sutil -->
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a1a3a" stop-opacity="0.20"/>
    </radialGradient>

    <!-- Blur leve só p/ suavizar as bordas das nuvens (sem achatar o volume) -->
    <filter id="softclouds" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Céu até o horizonte (~70%) -->
  <rect x="0" y="0" width="1600" height="704" fill="url(#sky)"/>
  <!-- Brilho de sol no horizonte -->
  <rect x="0" y="180" width="1600" height="524" fill="url(#sun)"/>

  <!-- Nuvens cumulus: grupos de círculos sobrepostos com base achatada -->
  <g filter="url(#softclouds)">
    <!-- Cumulus grande à esquerda -->
    <g fill="url(#cloud)">
      <ellipse cx="360" cy="232" rx="232" ry="44"/>
      <circle cx="196" cy="222" r="40"/>
      <circle cx="262" cy="210" r="54"/>
      <circle cx="340" cy="184" r="76"/>
      <circle cx="424" cy="194" r="62"/>
      <circle cx="492" cy="214" r="46"/>
    </g>
    <!-- Cumulus média à direita -->
    <g fill="url(#cloud)">
      <ellipse cx="1206" cy="178" rx="204" ry="40"/>
      <circle cx="1108" cy="166" r="46"/>
      <circle cx="1190" cy="140" r="66"/>
      <circle cx="1272" cy="154" r="52"/>
      <circle cx="1330" cy="170" r="36"/>
    </g>
    <!-- Nuvenzinha baixa central -->
    <g fill="url(#cloud)" opacity="0.9">
      <ellipse cx="820" cy="372" rx="152" ry="26"/>
      <circle cx="766" cy="360" r="32"/>
      <circle cx="828" cy="344" r="46"/>
      <circle cx="888" cy="358" r="34"/>
    </g>
  </g>

  <!-- Colina única, horizonte nítido em y≈700 -->
  <path d="M0,700 C300,656 560,648 820,672 C1080,696 1340,690 1600,662 L1600,1000 L0,1000 Z" fill="url(#hill)"/>
  <!-- Faixa de highlight na crista -->
  <path d="M0,700 C300,656 560,648 820,672 C1080,696 1340,690 1600,662 L1600,690 C1340,718 1080,724 820,700 C560,676 300,684 0,730 Z" fill="url(#crest)"/>

  <!-- Vinheta sobre tudo -->
  <rect x="0" y="0" width="1600" height="1000" fill="url(#vignette)"/>
</svg>
