<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- "Bliss" à mão: céu azul, nuvens suaves e colina verde ondulada (easter egg XP) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E5AC8"/>
      <stop offset="0.35" stop-color="#3E7FD9"/>
      <stop offset="0.62" stop-color="#7FB2EF"/>
      <stop offset="0.78" stop-color="#C4DDF6"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8CC63F"/>
      <stop offset="0.4" stop-color="#5FA832"/>
      <stop offset="1" stop-color="#2F7A1F"/>
    </linearGradient>
    <linearGradient id="hillshade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- nuvens -->
  <g fill="#FFFFFF" filter="url(#soft)">
    <g opacity="0.9">
      <ellipse cx="330" cy="180" rx="150" ry="42"/>
      <ellipse cx="430" cy="150" rx="110" ry="36"/>
      <ellipse cx="250" cy="150" rx="90" ry="30"/>
    </g>
    <g opacity="0.75">
      <ellipse cx="1150" cy="120" rx="180" ry="40"/>
      <ellipse cx="1270" cy="95" rx="110" ry="30"/>
      <ellipse cx="1050" cy="95" rx="90" ry="26"/>
    </g>
    <g opacity="0.6">
      <ellipse cx="800" cy="300" rx="140" ry="26"/>
      <ellipse cx="890" cy="280" rx="90" ry="20"/>
    </g>
    <g opacity="0.5">
      <ellipse cx="1450" cy="330" rx="120" ry="22"/>
    </g>
  </g>

  <!-- colina -->
  <path d="M0,760 C260,600 520,570 800,650 C1080,730 1330,700 1600,560 L1600,1000 L0,1000 Z" fill="url(#hill)"/>
  <path d="M0,760 C260,600 520,570 800,650 C1080,730 1330,700 1600,560 L1600,1000 L0,1000 Z" fill="url(#hillshade)"/>
  <!-- segunda colina, mais clara, ao fundo à direita -->
  <path d="M900,1000 C1050,780 1300,740 1600,780 L1600,1000 Z" fill="#4E9429" opacity="0.85"/>
</svg>
