<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG (selo quadrado da marca) para quem suporta; o .png fica de fallback (Windows, browsers antigos). -->
    <link rel="icon" type="image/svg+xml" href="/brand/marca.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/marca.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <!-- Instalável na tela inicial do celular (spec v2-mobile-e-home, M2). A cor da
         barra do sistema é sincronizada em runtime com o tema pelo MobileShell. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F0F0F2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nevo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- viewport-fit=cover: a tab bar e o topo usam env(safe-area-inset-*) para
         não ficar embaixo do notch nem da barra de gestos. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Nevo - gestão de tarefas, bug reports e times." />
    <meta property="og:title" content="Nevo" />
    <meta property="og:description" content="Gestão simples e direta: tarefas, bug reports e notificações no Discord." />
    <meta property="og:type" content="website" />
    <title>Nevo - Fluvio</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
